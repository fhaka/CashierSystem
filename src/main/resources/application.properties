spring.application.name=supermarket-cashier-system
spring.profiles.active=local

server.address=0.0.0.0
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE:cashier_system}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Tirane
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.h2.console.enabled=false

# Optional: set this to your Windows thermal printer name.
# If empty, the backend uses the default Windows printer.
receipt.printer.name=Ocom Printer

spring.application.name=supermarket-cashier-system
spring.profiles.active=local

server.address=0.0.0.0
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE:cashier_system}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Tirane
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:haka_pos}
spring.datasource.password=${MYSQL_PASSWORD:}

# The schema is owned by Flyway migrations in db/migration. Hibernate never changes tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Loads lazy lists (sale lines, payments) in groups instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.flyway.locations=classpath:db/migration
# Databases created before Flyway already contain the V1 schema: mark them as V1 instead of re-creating tables.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema before Flyway

spring.h2.console.enabled=false

# Optional: set this to your Windows thermal printer name.
# If empty, the backend uses the default Windows printer.
receipt.printer.name=Ocom Printer

# Language: Albanian by default. A till can ask for English with the Accept-Language header.
spring.web.locale=sq
spring.web.locale-resolver=accept-header
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Security
# A till is signed out after this long without any activity.
pos.session.idle-timeout=12h
# Wrong passwords allowed before the account is locked, and for how long.
pos.login.max-attempts=5
pos.login.lock-duration=5m
# Other web front-ends allowed to call the API (comma separated). Empty: only the built-in screen.
pos.cors.allowed-origins=

# Automatic discount on large purchases. Set enabled=false to turn it off.
pos.discount.enabled=true
pos.discount.threshold=20000.00
pos.discount.percent=10

# A cashier needs a manager's PIN to remove lines, lower quantities or clear the cart.
# Price changes and refunds by cashiers always need a PIN.
pos.approval.voids=true

# Scale labels (EAN-13 starting with one of these prefixes): product = first 7 digits,
# then 5 digits with the weight in grams (WEIGHT) or the price in LEK (PRICE).
pos.scale.prefixes=21,22,23,24,25,26,27,28,29
pos.scale.mode=WEIGHT

# Manual discount a cashier may give without a manager's PIN (percent of the cart).
pos.discount.cashier-limit-percent=0

# Loyalty: one point for every lek-per-point LEK paid; one point is worth point-value LEK.
pos.loyalty.lek-per-point=100
pos.loyalty.point-value=1

# Reports: true when product purchase prices include VAT (profit is always counted without VAT)
pos.reports.cost-includes-vat=true

# Daily Z report by email (off until both the recipients and a mail server are set).
# pos.report.email.to=owner@example.com,accountant@example.com
# pos.report.email.cron=0 30 23 * * *

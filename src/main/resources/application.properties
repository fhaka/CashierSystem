spring.application.name=supermarket-cashier-system

spring.datasource.url=jdbc:h2:mem:supermarket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Optional: set this to your Windows thermal printer name.
# If empty, the backend uses the default Windows printer.
receipt.printer.name=

# MySQL switch example:
# spring.datasource.url=jdbc:mysql://localhost:3306/supermarket
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=update
